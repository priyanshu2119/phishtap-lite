<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PhishTap — what you missed</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07090f">
<!--
  PhishTap Lite — REVIEW PAGE (phone, after the game).

  This is the only page that ever receives the correct answers, the cues and the
  explanations. The server enforces that: review_payload is reachable only with a
  review token, which is issued at game over and expires ten minutes later.

  It is also where "delete my data" lives, deliberately scoped to the review token
  rather than to a card tap. In shared-card mode one card is used by several
  people, so a tap cannot say who is asking; a tap-scoped delete would let one
  student erase another's record. The review token identifies exactly one player.
-->
<link rel="stylesheet" href="css/app.css">
<style>
  .review-head { text-align: center; padding: 24px 0 8px; }
  .review-score {
    font-size: clamp(56px, 18vw, 104px);
    font-weight: 900; line-height: 0.95;
    color: var(--warn); font-variant-numeric: tabular-nums;
  }
  .review-summary { color: var(--fg-dim); margin-top: 6px; }
  .review-intro {
    font-size: var(--fs-sm); color: var(--fg-dim);
    border-left: 3px solid var(--accent);
    padding: 8px 0 8px 12px; margin: 20px 0;
  }

  .round {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin-bottom: 16px;
  }
  .round.right { border-left: 5px solid var(--safe); }
  .round.wrong { border-left: 5px solid var(--phish); }

  .round-top {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border);
  }
  .round-n { font-size: var(--fs-xs); color: var(--fg-faint); text-transform: uppercase; letter-spacing: 0.08em; }

  .round-msg { padding: 14px; background: var(--bg-sunken); }
  .round-sender { font-weight: 700; }
  .round-subject { color: var(--fg-dim); font-size: var(--fs-sm); margin: 2px 0 10px; }
  .round-body { white-space: pre-wrap; word-break: break-word; font-size: var(--fs-sm); line-height: 1.55; }

  .round-verdict { padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .verdict-line { font-size: var(--fs-sm); }
  .verdict-line b { font-weight: 800; }
  .was-phish { color: var(--phish); }
  .was-safe  { color: var(--safe); }

  .round-teach { padding: 0 14px 14px; }
  .cues { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .cue {
    font-size: var(--fs-xs); font-weight: 700;
    padding: 4px 10px; border-radius: 999px;
    background: var(--warn-dim); color: #ffedc9; border: 1px solid var(--warn);
  }
  .teach-h { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-faint); font-weight: 700; }
  .teach-p { font-size: var(--fs-sm); color: var(--fg-dim); margin: 4px 0 12px; line-height: 1.55; }
  .lesson {
    background: var(--accent-dim); border: 1px solid var(--accent);
    border-radius: var(--radius); padding: 10px 12px;
    font-size: var(--fs-sm); color: #dcecff;
  }

  .data-zone {
    margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<div class="wrap">

  <section id="screen-loading" class="center" style="margin-top:30vh">
    <h1 id="loading-title">PhishTap</h1>
    <p class="muted" id="loading-text"></p>
  </section>

  <section id="screen-expired" class="center is-hidden" style="margin-top:25vh">
    <h1 id="expired-title"></h1>
    <p class="muted" id="expired-text"></p>
  </section>

  <main id="screen-review" class="is-hidden">
    <header class="review-head">
      <div class="eyebrow" id="review-title"></div>
      <div class="review-score" id="review-score">0</div>
      <div class="review-summary" id="review-summary"></div>
    </header>

    <p class="review-intro" id="review-intro"></p>

    <div id="rounds"></div>

    <section class="data-zone">
      <h2 id="data-title"></h2>
      <p class="small muted" id="data-body"></p>
      <p class="tiny faint mono" id="data-id"></p>
      <div id="data-error" class="banner banner-error is-hidden" role="alert"></div>
      <div id="data-done" class="banner banner-ok is-hidden" role="status"></div>
      <button id="btn-delete" class="btn btn-danger btn-block" style="margin-top:12px"></button>
    </section>
  </main>

</div>

<script src="js/strings.js"></script>
<script src="js/common.js"></script>
<script src="js/review.js"></script>
</body>
</html>
