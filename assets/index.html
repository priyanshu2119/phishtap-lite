<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhishTap — console</title>
<meta name="robots" content="noindex, nofollow">
<!--
  PhishTap Lite — KIOSK PAGE.

  This is the laptop screen the audience watches. It is served as index.html
  because the WebUI brick requires an index.html in its assets directory and
  raises RuntimeError at startup without one.

  It has four jobs, in order of importance:
    1. Show a QR code and PIN so a phone can join.
    2. Mirror the live game so the audience can follow along.
    3. Say loudly when the console is not responding, because a silent black
       screen at a demo reads as "their project is broken" rather than "the
       board is unplugged".
    4. Look like an arcade cabinet, not a dashboard.

  All state arrives over Socket.IO in the "kiosk" room, with REST /api/kiosk as
  the fallback and as the initial paint. The page works with the socket entirely
  unavailable; it just polls instead.

  No external requests. No CDN. See LICENSES.md for the vendored libraries.
-->
<link rel="stylesheet" href="css/app.css">
<style>
  /* ── Kiosk-specific ──────────────────────────────────────────────────────
   * Type is scaled up hard. This page is read from three metres away by people
   * standing, on a laptop that is probably at 1366x768 and probably has a
   * reflection on it. Anything under about 18px is decoration.
   */
  body { font-size: 18px; }

  .kiosk {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 24px 32px;
    gap: 20px;
  }

  .kiosk-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
  }

  .kiosk-brand { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
  .kiosk-brand span { color: var(--accent); }

  .kiosk-body { flex: 1; display: flex; align-items: center; justify-content: center; }

  .kiosk-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
    font-size: 14px;
    color: var(--fg-faint);
    font-family: var(--font-mono);
  }

  /* Attract mode */
  .attract { text-align: center; max-width: 900px; }
  .attract-title {
    font-size: clamp(56px, 11vw, 132px);
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 0.95;
    margin: 0;
    background: linear-gradient(180deg, #ffffff 0%, #7fb6ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .attract-tag { font-size: clamp(20px, 2.6vw, 32px); color: var(--fg-dim); margin: 12px 0 28px; }
  .attract-cta {
    display: inline-block;
    font-size: clamp(22px, 3vw, 34px);
    font-weight: 800;
    padding: 18px 34px;
    border-radius: 999px;
    border: 2px solid var(--accent);
    color: var(--accent);
  }

  /* Join panel: QR + PIN side by side */
  .join {
    display: grid;
    grid-template-columns: auto auto;
    gap: 40px;
    align-items: center;
    justify-content: center;
  }
  @media (max-width: 820px) { .join { grid-template-columns: 1fr; gap: 24px; } }

  .qr-box {
    background: #fff;
    padding: 16px;
    border-radius: var(--radius-lg);
    line-height: 0;
  }
  .qr-box img, .qr-box canvas { display: block; }
  .qr-fallback {
    line-height: 1.4;
    color: #111;
    font-family: var(--font-mono);
    font-size: 13px;
    max-width: 240px;
    word-break: break-all;
  }

  .pin-panel { text-align: left; }
  .pin-label { font-size: 20px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.1em; }
  .pin-digits {
    font-size: clamp(56px, 9vw, 96px);
    font-weight: 900;
    letter-spacing: 0.14em;
    font-family: var(--font-mono);
    color: var(--warn);
    line-height: 1.1;
  }
  .pin-expiry { font-size: 18px; color: var(--fg-dim); margin-top: 8px; }

  /* Live game mirror */
  .mirror { width: 100%; max-width: 1000px; }
  .mirror-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    text-align: center;
  }
  .stat-k { font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-faint); }
  .stat-v { font-size: clamp(36px, 5vw, 56px); font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat-v.lives { color: var(--phish); letter-spacing: 0.08em; }

  .mirror-msg {
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-left: 6px solid var(--accent);
    border-radius: var(--radius-lg);
    padding: 20px 24px;
    max-height: 46vh;
    overflow: auto;
  }
  .mirror-msg-head { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .mirror-sender { font-weight: 700; font-size: 20px; }
  .mirror-subject { color: var(--fg-dim); font-size: 18px; margin-bottom: 12px; }
  .mirror-body { font-size: 20px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }

  /* Game over */
  .over { text-align: center; }
  .over-score {
    font-size: clamp(80px, 16vw, 190px);
    font-weight: 900;
    line-height: 0.9;
    color: var(--warn);
    font-variant-numeric: tabular-nums;
  }
  .over-who { font-size: clamp(24px, 3.4vw, 40px); margin-top: 8px; }
  .over-why { font-size: 20px; color: var(--fg-dim); margin-top: 12px; }

  /* Leaderboard */
  .board { width: 100%; max-width: 720px; margin: 28px auto 0; }
  .board-row {
    display: grid;
    grid-template-columns: 48px 1fr auto;
    gap: 12px;
    align-items: center;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 20px;
  }
  .board-row:nth-child(odd) { background: rgba(255,255,255,0.03); }
  .board-rank { color: var(--fg-faint); font-weight: 800; font-variant-numeric: tabular-nums; }
  .board-row:first-child .board-rank { color: var(--warn); }
  .board-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-score { font-family: var(--font-mono); font-weight: 800; font-variant-numeric: tabular-nums; }

  /* Status dot in the header */
  .link-dot {
    display: inline-block;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--safe);
    margin-right: 8px;
    vertical-align: middle;
  }
  .link-dot.down { background: var(--phish); }
  .link-dot.unknown { background: var(--fg-faint); }

  .fault-banner {
    font-size: 22px;
    font-weight: 700;
    padding: 16px 20px;
    border-radius: var(--radius);
    text-align: center;
  }

  /* Full-screen flash on a round result, so the audience sees the outcome even
   * from the back of the room. Brief and colour-only: no text, because reading
   * text from three metres away while it flashes is not possible anyway. */
  .flash-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    z-index: 50;
  }
  .flash-overlay.good { background: var(--safe); animation: pt-flash 700ms ease-out; }
  .flash-overlay.bad  { background: var(--phish); animation: pt-flash 700ms ease-out; }
</style>
</head>
<body>

<div class="kiosk">

  <header class="kiosk-head">
    <div class="kiosk-brand">Phish<span>Tap</span></div>
    <div id="link-status" class="small muted">
      <span id="link-dot" class="link-dot unknown"></span><span id="link-text">connecting…</span>
    </div>
  </header>

  <!-- Hardware / link fault. Shown above everything else, because nothing else on
       the page can be trusted while the console is unreachable. -->
  <div id="fault" class="banner banner-error fault-banner is-hidden" role="alert"></div>

  <main class="kiosk-body">

    <!-- ATTRACT: no session -->
    <section id="view-attract" class="attract is-hidden">
      <h1 class="attract-title" id="attract-title">PhishTap</h1>
      <p class="attract-tag" id="attract-tag"></p>
      <div class="attract-cta pulse" id="attract-cta"></div>

      <div class="board" id="board-wrap">
        <div class="eyebrow center" id="board-title"></div>
        <div id="board-list"></div>
      </div>
    </section>

    <!-- JOIN: session created, waiting for a phone -->
    <section id="view-join" class="is-hidden">
      <div class="join">
        <div>
          <div class="qr-box" id="qr"></div>
          <p class="hint center" id="qr-url" style="margin-top:12px; max-width:260px;"></p>
        </div>
        <div class="pin-panel">
          <div class="pin-label" id="pin-label"></div>
          <div class="pin-digits" id="pin-digits">----</div>
          <div class="pin-expiry" id="pin-expiry"></div>
          <p class="muted" id="join-hint" style="margin-top:20px; max-width:340px;"></p>
        </div>
      </div>
    </section>

    <!-- PLAYING: mirror the phone -->
    <section id="view-play" class="mirror is-hidden">
      <div class="mirror-stats">
        <div class="stat">
          <div class="stat-k" id="k-round"></div>
          <div class="stat-v" id="v-round">0</div>
        </div>
        <div class="stat">
          <div class="stat-k" id="k-lives"></div>
          <div class="stat-v lives" id="v-lives">♥♥♥</div>
        </div>
        <div class="stat">
          <div class="stat-k" id="k-score"></div>
          <div class="stat-v" id="v-score">0</div>
        </div>
      </div>
      <div class="mirror-msg">
        <div class="mirror-msg-head">
          <div class="mirror-sender" id="m-sender"></div>
          <div class="pill pill-dim" id="m-channel"></div>
        </div>
        <div class="mirror-subject" id="m-subject"></div>
        <div class="mirror-body" id="m-body"></div>
      </div>
      <p class="center muted" id="play-who" style="margin-top:16px;"></p>
    </section>

    <!-- OVER -->
    <section id="view-over" class="over is-hidden">
      <div class="eyebrow" id="over-eyebrow"></div>
      <div class="over-score" id="over-score">0</div>
      <div class="over-who" id="over-who"></div>
      <div class="over-why" id="over-why"></div>
      <div class="board" id="over-board-wrap">
        <div class="eyebrow center" id="over-board-title"></div>
        <div id="over-board-list"></div>
      </div>
    </section>

  </main>

  <footer class="kiosk-foot">
    <span id="foot-left"></span>
    <span id="foot-right"></span>
  </footer>

</div>

<div id="flash" class="flash-overlay"></div>

<script src="libs/socket.io.min.js"></script>
<script src="libs/qrcode.min.js"></script>
<script src="js/strings.js"></script>
<script src="js/common.js"></script>
<script src="js/kiosk.js"></script>
</body>
</html>
